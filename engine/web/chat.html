<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vitna-anchor</title>
<style>
:root {
  --bg: #fbfbf9; --fg: #1d1d1b; --muted: #66665f; --line: #e3e3dd; --soft: #f2f2ee;
  --accent: #1d5bb8; --err: #a8261d; --code: #f3f3ef;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312; --fg: #e7e7e2; --muted: #a0a099; --line: #2b2b28; --soft: #1c1c1a;
    --accent: #85adff; --err: #ff9a8f; --code: #1c1c1a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
header .name { font-weight: 600; white-space: nowrap; }
header .model { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
header .spacer { flex: 1; }
button {
  font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--soft); color: var(--fg);
  border-radius: 6px; padding: 6px 14px; cursor: pointer; flex-shrink: 0;
}
button:hover { border-color: var(--muted); }
button:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
main { flex: 1; overflow-y: auto; }
.log { max-width: 820px; margin: 0 auto; padding: 4px 16px 32px; }
.turn { padding: 16px 0; border-bottom: 1px solid var(--line); }
.turn:last-child { border-bottom: 0; }
.who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.text { overflow-wrap: anywhere; }
.text > :first-child { margin-top: 0; }
.text > :last-child { margin-bottom: 0; }
.text p, .text ul, .text ol, .text pre, .text table, .text blockquote { margin: 0 0 12px; }
.text h1, .text h2, .text h3 { font-size: 16px; margin: 18px 0 8px; }
.text ul, .text ol { padding-left: 24px; }
.text blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
.text a { color: var(--accent); }
.text table { border-collapse: collapse; display: block; overflow-x: auto; }
.text th, .text td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; vertical-align: top; }
.text th { background: var(--soft); font-weight: 600; }
pre {
  background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto;
  font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
}
code { font: 13px ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace; background: var(--code); padding: 1px 4px; border-radius: 4px; }
pre code { background: none; padding: 0; border-radius: 0; }
.user .text { white-space: pre-wrap; }
details.reasoning { margin: 0 0 10px; }
details.reasoning summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.reasoning .thought { white-space: pre-wrap; font-size: 14px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; margin-top: 6px; }
.stats { font-size: 12px; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
.error { color: var(--err); }
.empty { color: var(--muted); padding: 56px 0; text-align: center; }
footer { border-top: 1px solid var(--line); padding: 12px 16px 10px; }
form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; min-width: 0; resize: none; min-height: 44px; max-height: 240px; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px;
}
.options { max-width: 820px; margin: 8px auto 0; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 13px; color: var(--muted); }
.options label { display: inline-flex; gap: 6px; align-items: center; }
.hidden-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <span class="name">vitna-anchor</span>
  <span class="model" id="model">connecting to the server</span>
  <span class="spacer"></span>
  <button id="new" type="button">New chat</button>
</header>
<main id="scroll">
  <div class="log" id="log"></div>
</main>
<footer>
  <form id="form">
    <label for="input" class="hidden-label">Message</label>
    <textarea id="input" rows="1" placeholder="Message the model" aria-describedby="keys"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="options">
    <label id="think-option" hidden><input type="checkbox" id="think" checked> Think before answering</label>
    <span id="keys">Enter sends, Shift+Enter starts a new line</span>
    <span id="status" role="status"></span>
  </div>
</footer>
<script>
"use strict";

/* ---- The page's pure parts, which tests/chat-page.test.mjs runs in Node ---- */

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* Inline Markdown in text already escaped: code spans first, so nothing inside one is formatted. */
function renderInline(escaped) {
  const parts = escaped.split(/(`[^`]+`)/);
  return parts
    .map((part, i) => {
      if (i % 2 === 1) return "<code>" + part.slice(1, -1) + "</code>";
      return part
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, label, url) => '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + "</a>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");
    })
    .join("");
}

function isTableRow(line) {
  return /^\s*\|.*\|\s*$/.test(line);
}

function tableCells(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
}

/* Markdown to HTML, a safe subset: everything is escaped first, then fenced
 * code, headings, lists, quotes, tables and paragraphs. A fence still open,
 * as one is while a reply streams, runs to the end. */
function renderMarkdown(text) {
  const lines = text.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let para = [];
  const flush = () => {
    if (para.length) out.push("<p>" + para.map((l) => renderInline(escapeHtml(l))).join("<br>") + "</p>");
    para = [];
  };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const fence = line.match(/^\s*(```|~~~)\s*([\w+#.-]*)\s*$/);
    if (fence) {
      flush();
      const code = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) code.push(lines[i++]);
      out.push("<pre><code" + (fence[2] ? ' data-lang="' + escapeHtml(fence[2]) + '"' : "") + ">" + escapeHtml(code.join("\n")) + "</code></pre>");
      continue;
    }
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      flush();
      const level = Math.min(heading[1].length, 3);
      out.push("<h" + level + ">" + renderInline(escapeHtml(heading[2])) + "</h" + level + ">");
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      flush();
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        items.push(renderInline(escapeHtml(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ""))));
        i++;
      }
      i--;
      const tag = ordered ? "ol" : "ul";
      out.push("<" + tag + ">" + items.map((t) => "<li>" + t + "</li>").join("") + "</" + tag + ">");
      continue;
    }
    if (/^\s*>/.test(line)) {
      flush();
      const quote = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) quote.push(lines[i++].replace(/^\s*>\s?/, ""));
      i--;
      out.push("<blockquote>" + quote.map((l) => renderInline(escapeHtml(l))).join("<br>") + "</blockquote>");
      continue;
    }
    if (isTableRow(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
      flush();
      const head = tableCells(line);
      const rows = [];
      i += 2;
      while (i < lines.length && isTableRow(lines[i])) rows.push(tableCells(lines[i++]));
      i--;
      const cell = (tag, c) => "<" + tag + ">" + renderInline(escapeHtml(c)) + "</" + tag + ">";
      out.push(
        "<table><thead><tr>" + head.map((c) => cell("th", c)).join("") + "</tr></thead><tbody>" +
          rows.map((r) => "<tr>" + r.map((c) => cell("td", c)).join("") + "</tr>").join("") + "</tbody></table>",
      );
      continue;
    }
    if (line.trim() === "") flush();
    else para.push(line);
  }
  flush();
  return out.join("");
}

/* Server-sent events out of what has arrived: each complete event's data,
 * and what is left over, which the next read continues. */
function parseEvents(buffer) {
  const events = [];
  let at;
  while ((at = buffer.indexOf("\n\n")) >= 0) {
    const block = buffer.slice(0, at);
    buffer = buffer.slice(at + 2);
    const data = block.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).replace(/^ /, "")).join("\n");
    if (data) events.push(data);
  }
  return { events, rest: buffer };
}

/* A chat chunk's effect on the reply so far: its reasoning, its text, how it
 * ended, its usage, or the error a stream ends with. */
function applyChunk(reply, data) {
  if (data === "[DONE]") {
    reply.done = true;
    return reply;
  }
  const chunk = JSON.parse(data);
  if (chunk.error) {
    reply.error = chunk.error.message || "The server reported an error.";
    return reply;
  }
  const choice = chunk.choices && chunk.choices[0];
  if (choice && choice.delta) {
    if (typeof choice.delta.reasoning_content === "string") reply.reasoning += choice.delta.reasoning_content;
    if (typeof choice.delta.content === "string") reply.content += choice.delta.content;
  }
  if (choice && choice.finish_reason) reply.finish = choice.finish_reason;
  if (chunk.usage) reply.usage = chunk.usage;
  return reply;
}

function newReply() {
  return { reasoning: "", content: "", finish: null, usage: null, error: null, done: false };
}

/* The line under a reply: its tokens, how fast they came, and the prompt it read. */
function statsLine(usage, seconds) {
  if (!usage) return "";
  const n = (x) => x.toLocaleString("en-US");
  let s = n(usage.completion_tokens) + " tokens";
  if (seconds > 0) s += ", " + (usage.completion_tokens / seconds).toFixed(1) + " a second";
  s += ", prompt " + n(usage.prompt_tokens) + " tokens";
  const cached = usage.prompt_tokens_details && usage.prompt_tokens_details.cached_tokens;
  if (cached) s += " (" + n(cached) + " reused)";
  return s;
}

/* Qwen3's own recommendations, by whether it thinks first; other models' defaults otherwise. */
function samplingFor(template, think) {
  if (template !== "qwen3") return { temperature: 0.7 };
  return think ? { temperature: 0.6, top_p: 0.95, top_k: 20 } : { temperature: 0.7, top_p: 0.8, top_k: 20 };
}

/* ---- The page, in a browser ---- */

if (typeof document !== "undefined") {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), scroll = $("scroll"), form = $("form"), input = $("input"), send = $("send");
  const status = $("status"), think = $("think");
  let server = { model: null, template: "chatml", context: 0 };
  let history = [];
  let running = null;

  function atBottom() {
    return scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 40;
  }

  function showEmpty() {
    log.innerHTML = '<div class="empty">' + (server.model ? "Ask " + escapeHtml(server.model) + " something." : "") + "</div>";
  }

  function addTurn(role, label) {
    const empty = log.querySelector(".empty");
    if (empty) empty.remove();
    const turn = document.createElement("section");
    turn.className = "turn " + role;
    turn.innerHTML = '<div class="who"></div><div class="text"></div>';
    turn.querySelector(".who").textContent = label;
    log.appendChild(turn);
    return turn;
  }

  function drawReply(turn, reply, seconds, live) {
    const stick = atBottom();
    let html = "";
    if (reply.reasoning) {
      const open = turn.querySelector("details.reasoning");
      const label = live && !reply.content ? "Thinking" : "Reasoning";
      html += '<details class="reasoning"' + (open && open.open ? " open" : "") + "><summary>" + label + '</summary><div class="thought">' +
        escapeHtml(reply.reasoning.trim()) + "</div></details>";
    }
    html += renderMarkdown(reply.content);
    if (reply.error) html += '<p class="error">' + escapeHtml(reply.error) + "</p>";
    else if (reply.finish === "length") html += '<p class="error">The reply stopped at the context\'s end or the token limit.</p>';
    const stats = statsLine(reply.usage, seconds);
    if (stats) html += '<div class="stats">' + escapeHtml(stats) + "</div>";
    turn.querySelector(".text").innerHTML = html;
    if (stick) scroll.scrollTop = scroll.scrollHeight;
  }

  function setRunning(on) {
    send.textContent = on ? "Stop" : "Send";
    $("keys").hidden = on;
    status.textContent = on ? "Generating. Esc stops it." : "";
  }

  async function ask(text) {
    history.push({ role: "user", content: text });
    addTurn("user", "You").querySelector(".text").textContent = text;
    const turn = addTurn("assistant", server.model || "model");
    const reply = newReply();
    const useThink = server.template === "qwen3" && think.checked;
    const body = {
      messages: history.map((m) => ({ role: m.role, content: m.content })),
      stream: true,
      stream_options: { include_usage: true },
      ...samplingFor(server.template, useThink),
    };
    if (server.model) body.model = server.model;
    if (server.template === "qwen3") body.chat_template_kwargs = { enable_thinking: useThink };
    const controller = new AbortController();
    running = controller;
    setRunning(true);
    let first = 0;
    const started = performance.now();
    try {
      const res = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
        signal: controller.signal,
      });
      if (!res.ok) {
        const err = await res.json().catch(() => null);
        reply.error = (err && err.error && err.error.message) || "The server answered " + res.status + ".";
      } else {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let drawing = false;
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          if (!first) first = performance.now();
          const parsed = parseEvents(buffer + decoder.decode(value, { stream: true }));
          buffer = parsed.rest;
          for (const data of parsed.events) applyChunk(reply, data);
          // At most one drawing a frame, however fast the tokens come.
          if (!drawing) {
            drawing = true;
            requestAnimationFrame(() => {
              drawing = false;
              if (running === controller) drawReply(turn, reply, 0, true);
            });
          }
        }
        if (!reply.done && !reply.error) reply.error = "The stream ended before the reply did.";
      }
    } catch (e) {
      if (e.name === "AbortError") reply.error = "Stopped.";
      else reply.error = "Could not reach the server: " + e.message;
    }
    const seconds = first ? (performance.now() - first) / 1000 : (performance.now() - started) / 1000;
    drawReply(turn, reply, seconds, false);
    // What was written stays in the conversation, even a reply that was stopped.
    if (reply.content || reply.reasoning) history.push({ role: "assistant", content: reply.content });
    else history.pop();
    running = null;
    setRunning(false);
    input.focus();
  }

  function grow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 240) + "px";
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (running) {
      running.abort();
      return;
    }
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    grow();
    ask(text);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  input.addEventListener("input", grow);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && running) running.abort();
  });
  $("new").addEventListener("click", () => {
    if (running) running.abort();
    history = [];
    showEmpty();
    input.focus();
  });

  fetch("/v1/health")
    .then((r) => r.json())
    .then((h) => {
      if (!h.model || !h.generation) {
        $("model").textContent = h.message || "This server has no model that generates text.";
        input.disabled = true;
        send.disabled = true;
        return;
      }
      server = { model: h.model, template: h.chat_template || "chatml", context: h.context || 0 };
      $("model").textContent = h.model + (h.context ? ", " + h.context.toLocaleString("en-US") + "-token context" : "");
      $("think-option").hidden = server.template !== "qwen3";
      document.title = h.model + " on vitna-anchor";
      showEmpty();
    })
    .catch(() => {
      $("model").textContent = "The server did not answer.";
    });
  showEmpty();
  input.focus();
}
</script>
</body>
</html>
