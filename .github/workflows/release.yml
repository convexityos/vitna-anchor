name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            binary: vitna-anchor-linux-x86_64
            artifact-name: vitna-anchor-linux-x86_64
            build-cmd: |
              cd engine
              make
              cp vitna-anchor ../vitna-anchor-linux-x86_64
              chmod +x ../vitna-anchor-linux-x86_64
          - os: macos-latest
            target: macos-arm64
            binary: vitna-anchor-macos-arm64
            artifact-name: vitna-anchor-macos-arm64
            build-cmd: |
              cd engine
              make
              cp vitna-anchor ../vitna-anchor-macos-arm64
              chmod +x ../vitna-anchor-macos-arm64
          - os: windows-latest
            target: windows-x64
            binary: vitna-anchor-windows-x64.exe
            artifact-name: vitna-anchor-windows-x64.exe
            build-cmd: |
              cmake -B engine/build -S engine
              cmake --build engine/build --config Release
              cp engine/build/Release/vitna-anchor.exe vitna-anchor-windows-x64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Native C11 Engine
        shell: bash
        run: ${{ matrix.build-cmd }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.binary }}

  publish-release:
    name: Publish Release Assets and Package
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Run Test Suite
        run: npm test

      - name: Verify Package Tarball Packaging
        run: npm pack --dry-run

      - name: Download Built Binaries
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Compute SHA256 Checksums
        run: |
          cd release-binaries
          sha256sum vitna-anchor-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-binaries/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish to NPM Registry
        if: startsWith(github.ref, 'refs/tags/v') && env.NPM_AUTH_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
