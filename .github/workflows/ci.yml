name: CI

on:
  push:
    branches: [ main ]
  # Every pull request, whatever its base, so a pull request stacked on another
  # one is checked too.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-node:
    name: Node ${{ matrix.node-version }} tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing job must not cancel the others and hide what they would
      # have found.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 18 and 20 are past end of life. 22 is the oldest line the test glob
        # works on: npm runs scripts through cmd.exe on Windows, which leaves
        # the pattern to the test runner, and the runner expands patterns
        # itself only from Node 21.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run Test Suite
        run: npm test

  build-engine:
    name: Build C11 Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Build Engine with Make (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd engine
          make
      - name: Run the int4 kernel microbenchmark (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          ./engine/vitna-anchor bench --iterations 5
      - name: Build Engine with CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B engine/build -S engine
          cmake --build engine/build --config Release
      - name: Run the int4 kernel microbenchmark (Windows)
        if: runner.os == 'Windows'
        run: |
          .\engine\build\Release\vitna-anchor.exe bench --iterations 5
      - name: Test the engine's server
        env:
          VITNA_REQUIRE_ENGINE: "1"
        run: node --test tests/engine-server.test.mjs
