name: CI

on:
  push:
    branches: [ main ]
  # Every pull request, whatever its base, so a pull request stacked on another
  # one is checked too.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-node:
    name: Node ${{ matrix.node-version }} tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing job must not cancel the others and hide what they would
      # have found.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 18 and 20 are past end of life. 22 is the oldest line the test glob
        # works on: npm runs scripts through cmd.exe on Windows, which leaves
        # the pattern to the test runner, and the runner expands patterns
        # itself only from Node 21.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run Test Suite
        run: npm test

  build-engine:
    # Linux and Windows run x86-64 (the AVX2 path where the runner has it),
    # macOS runs arm64 (the NEON path).
    name: Engine and gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Build the engine and its unit tests with Make (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd engine
          make all vitna-anchor-tests
      - name: Run the unit tests (Linux / macOS)
        if: runner.os != 'Windows'
        run: ./engine/vitna-anchor-tests
      - name: Run the int4 kernel microbenchmark (Linux / macOS)
        if: runner.os != 'Windows'
        run: ./engine/vitna-anchor bench --iterations 5
      - name: Build the engine and its unit tests with CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B engine/build -S engine
          cmake --build engine/build --config Release
      - name: Run the unit tests (Windows)
        if: runner.os == 'Windows'
        run: .\engine\build\Release\vitna-anchor-tests.exe
      - name: Run the int4 kernel microbenchmark (Windows)
        if: runner.os == 'Windows'
        run: .\engine\build\Release\vitna-anchor.exe bench --iterations 5
      - name: Test the engine's server
        env:
          VITNA_REQUIRE_ENGINE: "1"
        run: node --test tests/engine-server.test.mjs
      - name: Cache the pinned model files
        uses: actions/cache@v6
        with:
          path: models/smollm2-135m
          key: model-${{ hashFiles('reference/smollm2-135m/model.json') }}
      - name: Fetch the model at the pinned revision, checking every file's SHA-256
        run: node scripts/fetch-model.mjs
      - name: Gate A2, the engine against the reference
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/reference.test.mjs
      # Gate A5's model is 13.8 GB, more than CI fetches. Its tokenizer.json
      # is 2 MB, and the engine's tokenizer, NFC and all, is compared with it.
      - name: Cache OLMoE's tokenizer
        uses: actions/cache@v6
        with:
          path: models/olmoe-1b-7b
          key: olmoe-tokenizer-${{ hashFiles('reference/olmoe-1b-7b/model.json') }}
      - name: Fetch OLMoE's tokenizer.json at the pinned revision, checking its SHA-256
        run: node scripts/fetch-model.mjs olmoe-1b-7b --only tokenizer.json
      - name: Gate A5, the engine's tokenizer against OLMoE's reference
        env:
          VITNA_REQUIRE_MOE_TOKENIZER: "1"
        run: node --test --test-reporter=spec tests/reference-moe.test.mjs
      # Gate A9's model is 61.1 GB; its tokenizer.json is 11 MB, and the
      # engine's tokenizer, Qwen's split pattern and all, is compared with it.
      - name: Cache Qwen3's tokenizer
        uses: actions/cache@v6
        with:
          path: models/qwen3-30b-a3b
          key: qwen3-tokenizer-${{ hashFiles('reference/qwen3-30b-a3b/model.json') }}
      - name: Fetch Qwen3's tokenizer.json at the pinned revision, checking its SHA-256
        run: node scripts/fetch-model.mjs qwen3-30b-a3b --only tokenizer.json
      - name: Gate A9, the engine's tokenizer against Qwen3's reference
        env:
          VITNA_REQUIRE_QWEN3_TOKENIZER: "1"
        run: node --test --test-reporter=spec tests/reference-qwen3.test.mjs
      # Gate A7's GGUF files are 4 to 7 GB each, more than CI fetches, so only
      # the fixtures are checked here: each the one its pins and recorders
      # describe. The engine is compared with them by hand (README).
      - name: Gate A7, the quantized fixtures as recorded
        run: node --test --test-reporter=spec tests/reference-gguf.test.mjs
      # Gate A11: the engine writes a conversation, tools and tool calls
      # included, in Qwen3's own chat template, byte for byte as transformers
      # renders it. No model is needed, only the engine.
      - name: Gate A11, conversations in the model's own chat template
        env:
          VITNA_REQUIRE_ENGINE: "1"
        run: node --test --test-reporter=spec tests/chat-template.test.mjs
      # And the three APIs over it: OpenAI's chat and Responses and
      # Anthropic's Messages, each written as one conversation and answered
      # in its own shape, whole and streamed, tool calls and reasoning
      # included, driven through the pinned model by test hooks.
      - name: Gate A11, OpenAI's and Anthropic's APIs over one conversation
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/api-surface.test.mjs
      # Gate A12's chat page: built into the engine as it is in
      # engine/web/chat.html, its pure parts run in Node, and served at /.
      - name: Gate A12, the chat page the server serves
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/chat-page.test.mjs
      # And its installer's engine half: the catalogue, the plan for a
      # machine and the files' check. The scripts run end to end on fresh
      # runners in install.yml.
      - name: Gate A12, the installer's plan and check
        env:
          VITNA_REQUIRE_ENGINE: "1"
        run: node --test --test-reporter=spec tests/install.test.mjs
      - name: Gate A3, serving over the OpenAI-compatible API
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/serving.test.mjs
      - name: Gate A6, prefix reuse and JSON mode
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/reuse-and-json.test.mjs
      - name: Gate A3, a step that fails is an error the client sees
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/step-failure.test.mjs
      - name: The command line says why a step did not run
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/step-failure-cli.test.mjs
      - name: Drafted tokens, checked together, change no reply
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/speculate.test.mjs
      - name: Drafted tokens change no response from the server
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/speculate-serve.test.mjs
      - name: Requests at once change no response from the server
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/parallel-serve.test.mjs
      - name: Cache the pinned embedding model's files
        uses: actions/cache@v6
        with:
          path: models/bge-small-en-v1.5
          key: embed-model-${{ hashFiles('reference/bge-small-en-v1.5/model.json') }}
      - name: Fetch the embedding model at the pinned revision, checking every file's SHA-256
        run: node scripts/fetch-model.mjs bge-small-en-v1.5
      - name: Gate A14, the engine's embeddings against the reference
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/reference-embed.test.mjs
      - name: Gate A14, embeddings served over the OpenAI-compatible API
        env:
          VITNA_REQUIRE_REFERENCE: "1"
        run: node --test --test-reporter=spec tests/embeddings-serve.test.mjs

  cuda:
    # GitHub's hosted runners have no GPU. This job compiles the CUDA path, so
    # it cannot rot unnoticed, and checks that an engine asked for a device it
    # cannot use says why and stops. It never runs the model on a GPU: gate A4
    # was checked by hand on one, and the README says how.
    name: CUDA path compiles (Linux, no GPU)
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.1.1-devel-ubuntu24.04
    env:
      VITNA_REQUIRE_ENGINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install make, a host compiler and CMake
        run: apt-get update && apt-get install -y --no-install-recommends make gcc g++ cmake
      - name: An engine built without CUDA refuses --device cuda
        run: |
          make -C engine all
          node --test --test-reporter=spec tests/device.test.mjs
      - name: Build the engine and its unit tests with the CUDA path, with Make, for sm_86
        run: |
          make -C engine clean
          make -C engine VITNA_CUDA=1 CUDA_ARCH=sm_86 all vitna-anchor-tests
      - name: Run the unit tests
        run: ./engine/vitna-anchor-tests
      - name: With no GPU, the engine built with CUDA refuses --device cuda before loading anything
        env:
          VITNA_EXPECT_NO_GPU: "1"
        run: node --test --test-reporter=spec tests/device.test.mjs
      - name: Build with the CUDA path, with CMake, for every major GPU architecture
        run: |
          cmake -B engine/build -S engine -DVITNA_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=all-major -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build --parallel
